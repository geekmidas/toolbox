name: Continuous Integration

on:
  push:
    branches: [main, v9]
  pull_request:
    branches: [main, v9]
    # Not `edited`: it fires on every title and description edit, and each
    # one left a skipped "Validate" as the newest result, which GitHub counts
    # as passing — a failed PR read as green after any description edit. A
    # retargeted PR builds on its next push, or from "Re-run jobs".
    types: [opened, synchronize, reopened]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write
  packages: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
          registry-url: https://registry.npmjs.org
      - name: Install npm 10.9.0
        run: npm install -g npm@10.9.0
      - name: Upgrade npm to latest
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync CLI versions
        run: pnpm --filter @geekmidas/cli sync-versions

      # One range per dependency per field, from scripts/dependency-versions.json.
      # Tranche 1 found thirty dependencies disagreeing with themselves — `hono`
      # with four peer ranges — because nothing checked.
      - name: Check dependency ranges agree
        run: pnpm run check:deps

      - name: Build
        run: pnpm run build

      # Starts the built `gkm` and asks every command for --help. Nothing else
      # ran the binary, and a duplicate option in the commander wiring shipped
      # a CLI that died at startup for every command.
      - name: Check the CLI starts
        run: pnpm run check:cli

      - name: Check declared exports resolve
        run: pnpm run check:exports

      # Packs the tarballs and installs each into an empty project. The
      # workspace cannot catch a missing dependency — pnpm links everything
      # regardless of what a package.json claims — so this is the only step
      # that sees what a consumer sees. `alpha.1` shipped unloadable because
      # nothing did this.
      - name: Check a consumer install resolves
        run: pnpm run check:install

      - name: Lint
        run: pnpm run lint

      # The repo typechecked with eight errors for as long as nothing ran this.
      # `#test` is generated by `gkm test`, so a typecheck that runs before the
      # suite has nothing to resolve it to. `--prepare` writes the manifest and
      # the harness and stops — no containers, no suite.
      - name: Prepare kitchen-sink's test harness
        working-directory: apps/kitchen-sink
        env:
          GKM_AUTO_SETUP: '1'
        run: pnpm exec gkm test --prepare

      - name: Typecheck
        run: pnpm run ts:check

      # The package suites run on the pull request, and a push to main is one
      # that already passed them. The kitchen-sink steps below still run on
      # main: they drive the CLI, the constructs and the harness together.
      - name: Set Test Environment
        if: github.event_name != 'push'
        uses: hoverkraft-tech/compose-action@v2.2.0

      - name: Test (unit)
        if: github.event_name != 'push'
        timeout-minutes: 15
        env:
          CI: true
        run: pnpm run test:once

      # An application, driven the way one is: `gkm test` reconciles its test
      # stage (its own containers, on ports it allocates), writes the test
      # manifest and the harness generated from it, and runs its suite through
      # that — so the CLI, the constructs and the harness are proven together,
      # which no package's own tests can do. No committed secrets or shared key:
      # auto-setup generates the stage.
      - name: Test (kitchen-sink, through gkm test)
        timeout-minutes: 15
        working-directory: apps/kitchen-sink
        env:
          CI: true
          GKM_AUTO_SETUP: '1'
        run: pnpm test

      # `gkm build` from the workspace root, as a deploy runs it: every app,
      # through turbo — the API's handlers, the auth server's own entry, the
      # Vite site and the Next app.
      - name: Build (kitchen-sink, through gkm build)
        timeout-minutes: 10
        working-directory: apps/kitchen-sink
        run: pnpm build

      # `gkm dev` on the whole workspace, from its root. Setup generates the
      # local stage (there are no committed secrets) and starts its containers;
      # migrate gives the auth server its tables; then every app has to answer
      # on the port the workspace provisioned for it — see scripts/check-dev.mjs.
      - name: Dev (kitchen-sink, through gkm dev)
        timeout-minutes: 15
        working-directory: apps/kitchen-sink
        run: |
          pnpm exec gkm setup --yes
          pnpm migrate
          pnpm --dir ../.. run check:dev

      - name: Commit synced versions
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: scripts/release.sh sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Every pull request runs the release that main will, short of pushing
      # and uploading. The publish step once called a build script that did not
      # exist, and nothing ran it before main — so alpha.7 and alpha.8 were
      # versioned in git and never published.
      - name: Release (dry run)
        if: github.event_name == 'pull_request'
        run: scripts/release.sh dry-run
        # The changelog generator wraps @changesets/changelog-github, which
        # looks up each changeset's commit and pull request on GitHub. Main's
        # version step has always had a token; without one here, every pull
        # request carrying a changeset failed.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Consumes any pending changesets, then compares the version with what
      # npm has on this branch's line (`scripts/release-state.mjs`). It fails,
      # rather than skipping, when git is behind npm or a bump lands on a
      # published version — the two ways a pipeline goes green while nothing is
      # ever released again.
      - name: Version packages
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: scripts/release.sh version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish packages
        if: steps.version.outputs.publish == 'true'
        run: scripts/release.sh publish

  # Its own job, so a pull request shows "Validate ✓" beside a red "Release
  # published" — this change is fine, the branch it targets is stuck. Without it
  # a failed publish was visible only in the history of the run that failed.
  release-state:
    name: Release published
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Is the target branch's version on npm?
        run: node scripts/release-state.mjs --released
