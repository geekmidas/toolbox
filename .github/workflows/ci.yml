name: Continuous Integration

on:
  push:
    branches: [main, v9]
  pull_request:
    branches: [main, v9]
    # A base change fires `edited`, which is not one of the default types — so a
    # PR retargeted onto main, the last step of unstacking a PR stack, never
    # built. It read as reviewed and green having never run once.
    types: [opened, synchronize, reopened, edited]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write
  packages: read

jobs:
  validate:
    name: Validate
    # `edited` has no narrower event to subscribe to: it also fires on every
    # title and body edit. `changes.base` is present only when the base
    # actually moved, so a typo fix in a description does not rebuild.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action != 'edited' ||
      github.event.changes.base != null
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
          registry-url: https://registry.npmjs.org
      - name: Install npm 10.9.0
        run: npm install -g npm@10.9.0
      - name: Upgrade npm to latest
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync CLI versions
        run: pnpm --filter @geekmidas/cli sync-versions

      - name: Build
        run: pnpm run build

      - name: Check declared exports resolve
        run: pnpm run check:exports

      - name: Lint
        run: pnpm run lint

      # The repo typechecked with eight errors for as long as nothing ran this.
      - name: Typecheck
        run: pnpm run ts:check

      - name: Set Test Environment
        uses: hoverkraft-tech/compose-action@v2.2.0

      - name: Test (unit)
        timeout-minutes: 10
        env:
          CI: true
        run: pnpm run test:once

      - name: Commit synced versions
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/cli/src/init/versions.ts
          git diff --staged --quiet || git commit -m "chore(cli): sync package versions"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Consumes any pending changesets. `released` records whether that actually
      # changed anything — without it, publish runs on every push to main and
      # npm rejects the unchanged versions, so docs-only commits fail CI.
      - name: Version packages
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          pnpm run version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No pending changesets — nothing to publish."
          else
            git commit -m "chore: version packages"
            git push
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish packages
        if: steps.version.outputs.released == 'true'
        run: pnpm changeset publish
