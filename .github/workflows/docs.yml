name: Deploy Docs to GitHub Pages

# Versioned docs. Two builds are assembled into one Pages artifact:
#   /toolbox/       ← the released line, built from `v9`
#   /toolbox/next/  ← in development, built from `main`
# When v10 goes stable, cut a `v10` branch, build it at the root, and move the
# frozen v9 build to /toolbox/v9/.
on:
  push:
    branches: [main, v9]
    paths:
      - 'apps/docs/**'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout in-development line (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: next
          fetch-depth: 0

      # The released line lives on `v9`, which is cut after the alignment
      # release. Until it exists, `main` is published at the root on its own so
      # the site keeps deploying instead of failing on a missing ref.
      - name: Does the released line exist?
        id: released
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}" v9 >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No v9 branch yet — publishing main at the site root."
          fi

      - name: Checkout released line (v9)
        if: steps.released.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: v9
          path: released
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Each line is a full workspace checkout, so dependencies are installed
      # per line rather than shared — the docs build resolves workspace packages.
      - name: Build released docs
        if: steps.released.outputs.exists == 'true'
        working-directory: released
        env:
          DOCS_BASE: /toolbox/
          DOCS_VERSION: v9
        run: |
          pnpm install --frozen-lockfile
          pnpm docs:build

      # Root path while there is no released line, /next/ once there is one.
      - name: Build in-development docs
        working-directory: next
        env:
          DOCS_BASE: ${{ steps.released.outputs.exists == 'true' && '/toolbox/next/' || '/toolbox/' }}
          DOCS_VERSION: next
        run: |
          pnpm install --frozen-lockfile
          pnpm docs:build

      - name: Assemble site
        run: |
          mkdir -p dist
          if [ "${{ steps.released.outputs.exists }}" = "true" ]; then
            cp -r released/apps/docs/.vitepress/dist/. dist/
            mkdir -p dist/next
            cp -r next/apps/docs/.vitepress/dist/. dist/next/
          else
            cp -r next/apps/docs/.vitepress/dist/. dist/
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
