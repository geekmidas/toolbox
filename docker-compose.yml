# One project name for every checkout. Compose names a project after its
# directory by default, so each worktree was a separate project asking for the
# same host ports, and the second to start failed with "port is already
# allocated". Named, every checkout attaches to the same running containers and
# `docker compose up -d --wait` is a no-op when they are up. The *_HOST_PORT
# overrides are still there for a clash with some *other* project.
name: geekmidas-toolbox-test

services:
  redis:
    image: redis
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - "cache:/data"
  cache:
    ports:
      - "${SRH_HOST_PORT:-8079}:80"
    image: hiett/serverless-redis-http:latest
    environment:
      SRH_MODE: env
      SRH_TOKEN: example_token
      SRH_CONNECTION_STRING: "redis://redis:6379" # Using `redis` hostname since they're in the same Docker network.
  postgres:
    restart: unless-stopped
    image: postgres:18
    volumes:
      - "dbdata18:/var/lib/postgresql"
    # Inline rather than bind-mounted from ./docker/postgres. A bind mount's
    # source is an absolute path, so every worktree computed a different config
    # hash for this service, and each one's `docker compose up` recreated the
    # shared container — killing the connections of whichever suite another
    # worktree was running at the time.
    configs:
      - source: postgres-init
        target: /docker-entrypoint-initdb.d/init.sql
    ports:
      # Overridable, because a developer with another project's Postgres on
      # 5432 otherwise cannot run this stack at all.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=geekmidas
      - POSTGRES_PASSWORD=geekmidas
      - POSTGRES_DB=geekmidas
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geekmidas -d geekmidas"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
  # Where `gkm test` sends an app's mail, and where a feature test reads it
  # back — the same container an app's local stack runs.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
      - "${MAILPIT_HOST_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 2s
      retries: 15
  rabbitmq:
    image: rabbitmq:4.1.1-management
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672" # Map the default AMQP port
      - "${RABBITMQ_MGMT_HOST_PORT:-15672}:15672" # Map the management UI port
    environment:
      RABBITMQ_DEFAULT_USER: geekmidas # Set the default username
      RABBITMQ_DEFAULT_PASS: geekmidas # Set the default password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq/mnesia/ # Persist RabbitMQ data
    healthcheck:
      # Its listeners accepting connections, not just the node answering a
      # ping: the node answers first, and a suite that connected on that
      # signal was refused.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      # Short, because the events suite's setup waits on it: at 30s a cold
      # start held every run for half a minute before the first check.
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s
    restart: always # Ensure the container restarts automatically
  minio:
    # pgsty's community build, and pinned. MinIO took their images off Docker
    # Hub and then put Quay behind a login, and each move took CI with it. The
    # fork ships the same binary, entrypoint and `mc`, so nothing else changes.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    entrypoint: sh
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - "minio-data:/data"
    environment:
      - MINIO_ROOT_USER=geekmidas
      - MINIO_ROOT_PASSWORD=geekmidas
      - MINIO_DEFAULT_BUCKETS=geekmidas
      - MINIO_ACCESS_KEY=geekmidas
      - MINIO_SECRET_KEY=geekmidas
    command: -c 'mkdir -p /data/geekmidas && /usr/bin/docker-entrypoint.sh server --console-address ":9001" /data'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
  localstack:
    # floci speaks the same wire protocol on the same port, in a third of the
    # memory and a quarter of the image. It enables every service rather than a
    # list, so there is no SERVICES to keep in step with what the tests use.
    image: floci/floci:latest
    ports:
      - "${LOCALSTACK_HOST_PORT:-4566}:4566" # AWS emulator gateway
    # SNS push tests deliver to a server on the host. Docker Desktop resolves
    # host.docker.internal by itself; Linux (CI) needs it mapped.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "localstack-data:/var/lib/localstack"
    healthcheck:
      # Bash, not curl. The image ships no curl, no wget, no nc and no grep, so
      # the previous check could never pass — it reported unhealthy 36 times in
      # a row and took every suite that waits on this service down with it.
      #
      # A TCP connect rather than a request to `/_localstack/health`: the
      # request works, but Compose interpolates `$` and mangles `\r\n` inside
      # the YAML, and a readiness check is not worth a quoting puzzle. The
      # gateway binds this port when its HTTP server is up, which is the fact
      # the waiters actually need.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/4566"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  dbdata18:
  minio-data:
  cache:
  rabbitmq_data:
  localstack-data:

configs:
  # Postgres runs this once, on an empty data directory.
  postgres-init:
    content: |
      -- Create additional databases for development
      CREATE DATABASE examples;

      -- Grant privileges
      GRANT ALL PRIVILEGES ON DATABASE examples TO geekmidas;
