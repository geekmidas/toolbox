packages:
  - "apps/*"
  # kitchen-sink is a workspace of its own — the shape a real product has, with
  # shared constructs at its root and its apps beneath. Its members need naming
  # here or pnpm only sees the outer directory.
  - "apps/kitchen-sink/apps/*"
  - "packages/*"

# One @types/react for the whole workspace. VitePress's @docsearch/react
# declares an optional `@types/react <19` peer, which pnpm auto-installed as 18
# and hoisted; packages with no copy of their own (@react-email/*,
# prism-react-renderer) resolved that one, and their React types stopped
# agreeing with everyone else's 19. `check:deps` holds each override to the
# workspace's range in scripts/dependency-versions.json.
overrides:
  "@docsearch/react>@types/react": "~19.3.0"
