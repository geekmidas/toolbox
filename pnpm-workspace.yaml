packages:
  - "apps/*"
  # kitchen-sink is a workspace of its own — the shape a real product has, with
  # shared constructs at its root and its apps beneath. Its members need naming
  # here or pnpm only sees the outer directory.
  - "apps/kitchen-sink/apps/*"
  - "packages/*"
  - "packages/telescope/ui"
  - "packages/studio/ui"

# One @types/react for the whole workspace. VitePress's @docsearch/react
# declares an optional `@types/react <19` peer, which pnpm auto-installs as 18
# and hoists; packages with no copy of their own (@react-email/*) then resolve
# that one, and their React types stop agreeing with everyone else's 19.
# Accepting 19 there lets pnpm reuse the workspace's copy instead.
peerDependencyRules:
  allowedVersions:
    "@docsearch/react>@types/react": "19"
