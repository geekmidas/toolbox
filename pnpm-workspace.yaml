packages:
  - "apps/*"
  # kitchen-sink is a workspace of its own — the shape a real product has, with
  # shared constructs at its root and its apps beneath. Its members need naming
  # here or pnpm only sees the outer directory.
  - "apps/kitchen-sink/apps/*"
  - "packages/*"
  - "packages/telescope/ui"
  - "packages/studio/ui"

packageExtensions:
  # Its declarations import React's types without declaring them, so they
  # resolved through the hoist to VitePress's @types/react 18 — and ui's code
  # block mixed React 18's CSSProperties with 19's.
  prism-react-renderer:
    peerDependencies:
      "@types/react": "*"
